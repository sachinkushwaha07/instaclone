services:
  postgres:
    image: postgres:16-alpine
    container_name: instaclone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: instaclone
      POSTGRES_USER: instaclone
      POSTGRES_PASSWORD: instaclone_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - instaclone-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instaclone -d instaclone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  instaclone-postgres-data:
