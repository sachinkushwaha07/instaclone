<section class="story-creator">
  <a routerLink="/" class="back">← Back to feed</a>
  <div class="creator-card">
    <p class="eyebrow">YOUR STORY</p>
    <h1>Share a moment</h1>
    <p class="hint">Photos and videos in your story disappear after 24 hours.</p>
    @if (previewUrl(); as url) {
      <img class="preview" [src]="url" alt="Selected story preview" />
    } @else {
      <label class="dropzone" for="story-file"><span>＋</span><strong>Choose a photo or video</strong><small>Images or videos up to your account limit</small></label>
    }
    <input id="story-file" type="file" accept="image/*,video/*" (change)="onFile($event)" />
    @if (fileName()) { <p class="selected">Selected: {{ fileName() }}</p> }
    @if (errorMessage(); as message) { <p class="error">{{ message }}</p> }
    <ui-button [disabled]="!fileName()" [loading]="uploading()" (clicked)="share()">Share to story</ui-button>
  </div>
</section>
