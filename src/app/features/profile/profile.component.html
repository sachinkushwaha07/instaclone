    @if (user(); as u) {
      <header class="header">
        <ui-avatar [src]="u.avatarUrl" [size]="86" [initials]="u.username[0]" />
        <div class="info">
          <div class="row">
            <h1>{{ u.username }}</h1>
            @if (u.isLive) {
              <span class="live-pill">LIVE</span>
            }
            <ui-button
              [variant]="u.followedByMe ? 'secondary' : 'primary'"
              [loading]="followPending()"
              [disabled]="followPending()"
              (clicked)="toggleFollow(u)"
            >
              {{ u.followedByMe ? 'Following' : 'Follow' }}
            </ui-button>
          </div>
          <div class="stats">
            <span><strong>{{ u.postCount }}</strong> posts</span>
            <span><strong>{{ u.followerCount }}</strong> followers</span>
            <span><strong>{{ u.followingCount }}</strong> following</span>
          </div>
          <p class="bio">{{ u.bio }}</p>
        </div>
      </header>

      <div class="grid">
        @for (post of posts(); track post.id) {
          <a class="thumb" [routerLink]="['/p', post.id]">
            @if (post.media[0]; as media) {
              <img [ngSrc]="media.thumbUrl" width="300" height="300" alt="" />
            }
          </a>
        }
      </div>
      <div appInfiniteScroll [disabled]="loading() || !hasMore()" (threshold)="loadMorePosts(u.id)"></div>
    }
